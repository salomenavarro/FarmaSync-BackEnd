services:
  db:
    image: postgres:16-alpine
    container_name: farmasync_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: farmasyncdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmasyncdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmasync_backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/farmasyncdb?schema=public"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
